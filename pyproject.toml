[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bfderemez-cacheedge"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出提示词缓存的复用边界上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bfderemez" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bfderemez.github.io"
Repository = "https://github.com/bfderemez/cacheedge"
Issues = "https://github.com/bfderemez/cacheedge/issues"

[project.scripts]
cacheedge = "cacheedge:main"

[tool.setuptools]
py-modules = ["cacheedge"]
